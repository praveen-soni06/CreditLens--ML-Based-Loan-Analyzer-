<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditLens Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">🏦</div>
            <h1 class="login-title">CreditLens</h1>
            <p class="login-subtitle">AI Credit Underwriting Portal</p>

            <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>

                {% if error %}
                    <div class="login-error">{{ error }}</div>
                {% endif %}

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <div class="login-footer">
                <p><strong>Demo Credentials:</strong></p>
                <p>Username: <code>admin</code></p>
                <p>Password: <code>admin123</code></p>
                <small>Authorized banking personnel only.</small>
            </div>
        </div>
    </div>

</body>
</html>
