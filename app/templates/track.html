{% extends "base.html" %}

{% block title %}Track Application | CreditLens{% endblock %}

{% block content %}
<div class="tracking-shell">
    <div class="tracking-card glass-panel">
        <span class="eyebrow">Secure Customer Portal</span>
        <h1>Track Application</h1>
        <p>Enter your Application ID and registered email to receive a verification code.</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('tracking.track_application') }}" class="enterprise-form">
            <div class="form-group floating-field">
                <input type="text" name="application_ref" placeholder="CL-2026-XXXXXXXX" required>
                <label>Application ID</label>
            </div>
            <div class="form-group floating-field">
                <input type="email" name="customer_email" placeholder="customer@email.com" required>
                <label>Registered Email</label>
            </div>
            <button type="submit" class="primary-btn">Send Verification Code</button>
        </form>
    </div>
</div>
{% endblock %}
